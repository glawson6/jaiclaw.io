version: '3.8'

services:
  jaiclaw-io:
    platform: linux/amd64
    build:
      context: .
      platforms:
        - linux/amd64
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
