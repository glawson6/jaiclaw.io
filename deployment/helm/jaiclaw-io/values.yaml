# Default values for jaiclaw-io
# This is a YAML-formatted file.
#
# IMPORTANT: Environment Variables and Build-Time Configuration
# ==============================================================
# This is a React application built with Vite, which means environment variables
# are processed at BUILD TIME, not runtime. The Docker image is built with the
# environment variables baked into the static JavaScript bundles.

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []

# Application image configuration
image:
  registry: tooling.taptech.net:5000
  repository: jaiclaw-io
  tag: "latest"
  digest: ""
  pullPolicy: Always
  pullSecrets: []

# Image pull secrets for private registry
imagePullSecrets:
  - name: taptech-registry-secret

# Application configuration
app:
  name: jaiclaw-io
  version: "1.0.0"

# Deployment configuration
replicaCount: 2

# Update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1

# Container configuration
container:
  port: 8080
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Health checks
healthCheck:
  enabled: true
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: jaiclaw-io.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Security context
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

# Pod security context
podSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""
  automount: true

# Environment variables (DOCUMENTATION ONLY - see note at top of file)
env: []

# Config maps
configMap:
  enabled: false
  data: {}

# Secrets
secrets:
  enabled: false
  data: {}

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Network Policy
networkPolicy:
  enabled: false
  ingress: []
  egress: []

# Monitoring
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}

# Extra manifests
extraManifests: []
