# Production environment values
# Override default values for production
#
# Image Tag Strategy: prod or version tag (e.g., 1.0.0)
# Build command: mvn clean package k8s:build k8s:push -Pprod

# Single replica for VPS deployment
replicaCount: 1

# Image configuration for production
image:
  registry: tooling.taptech.net:5000
  repository: jaiclaw-io
  tag: "latest"
  pullPolicy: Always

# Resource configuration for production
container:
  port: 8080
  resources:
    limits:
      cpu: 300m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations:
    production.environment: "true"

# Ingress for production (NGINX + cert-manager)
ingress:
  enabled: true
  className: "public"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
  hosts:
    - host: jaiclaw.io
      paths:
        - path: /
          pathType: Prefix
    - host: www.jaiclaw.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: jaiclaw-io-tls
      hosts:
        - jaiclaw.io
        - www.jaiclaw.io

# Autoscaling disabled for single-node VPS
autoscaling:
  enabled: false

# Pod disruption budget disabled for single replica
podDisruptionBudget:
  enabled: false

# No affinity needed for single-node VPS
affinity: {}

# Monitoring for production
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

# Pod annotations for production
podAnnotations:
  environment: "production"
  backup: "enabled"
  monitoring: "enabled"
